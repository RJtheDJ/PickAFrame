name: pickaframe_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  gal: ^2.3.3
  google_mlkit_document_scanner: ^0.6.1
  image_picker: ^1.2.3
  share_plus: ^13.3.1

  #these are the firebase things
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  google_sign_in: ^7.2.0
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  http: ^1.6.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/textures/wood/
    - assets/textures/metal/
    - assets/mouldings/

  shaders:
    - shaders/frame_material.frag